<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rider Fuel Adjustment</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#1f2937;
}

header{
    background:#111827;
    color:#fff;
    text-align:center;
    padding:22px;
}

header h1{margin:0}
header p{color:#d1d5db;margin:8px 0 0}

.container{
    max-width:950px;
    margin:auto;
    padding:25px 15px;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.upload{
    padding:20px;
    border:2px dashed #cbd5e1;
    border-radius:10px;
    background:#f8fafc;
}

.upload label{
    display:block;
    font-weight:bold;
    margin-bottom:10px;
}

.upload small{
    display:block;
    color:#64748b;
    margin-top:10px;
    line-height:1.5;
}

input{
    width:100%;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:7px;
}

.rate{
    width:220px;
    margin-top:25px;
}

button{
    margin-top:25px;
    border:none;
    background:#2563eb;
    color:#fff;
    padding:13px 22px;
    border-radius:7px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{opacity:.9}

#message{
    display:none;
    margin-top:20px;
    padding:13px;
    border-radius:7px;
}

.success{
    display:block!important;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block!important;
    background:#fee2e2;
    color:#991b1b;
}

.loading{
    display:block!important;
    background:#dbeafe;
    color:#1d4ed8;
}
</style>
</head>

<body>

<header>
<h1>Rider Fuel Adjustment</h1>
<p>Calculate rider orders and fuel amount automatically</p>
</header>

<div class="container">

<div class="card">

<h2>Upload Files</h2>

<div class="grid">

<div class="upload">

<label>📋 Order List *</label>

<input
type="file"
id="orderFile"
accept=".xlsx,.xls,.csv"
>

<small>
Required. Upload your Order List Excel file.
</small>

</div>


<div class="upload">

<label>📊 Fuel Amount Template (Optional)</label>

<input
type="file"
id="templateFile"
accept=".xlsx"
>

<small>
Optional. Upload only if you want the output
to use your existing Excel template and design.
</small>

</div>

</div>


<div class="rate">

<label><b>Fuel Per Order (Rs.)</b></label>

<br><br>

<input
type="number"
id="fuelRate"
value="61"
min="0"
>

</div>


<button onclick="processExcel()">
Generate Fuel Adjustment
</button>

<div id="message"></div>

</div>

</div>


<script>

function showMessage(text,type){

    const box=document.getElementById("message");

    box.textContent=text;

    box.className=type;

}


function normalizeText(value){

    return String(value||"")

    .toLowerCase()

    .replace(/\s+/g," ")

    .trim();

}


function titleCase(value){

    return String(value||"")

    .trim()

    .replace(/\s+/g," ")

    .toLowerCase()

    .split(" ")

    .map(word=>
        word.charAt(0).toUpperCase()
        +word.slice(1)
    )

    .join(" ");

}


function normalizeColumn(value){

    return String(value||"")

    .toLowerCase()

    .replace(/[^a-z0-9]/g,"");

}


function findColumn(row,names){

    const keys=Object.keys(row);

    for(const name of names){

        const target=normalizeColumn(name);

        const found=keys.find(
            key=>normalizeColumn(key)===target
        );

        if(found)return found;

    }

    return null;

}


function readOrderFile(file){

    return new Promise((resolve,reject)=>{

        const reader=new FileReader();

        reader.onload=function(event){

            try{

                const workbook=XLSX.read(
                    event.target.result,
                    {type:"array"}
                );

                let rows=[];

                workbook.SheetNames.forEach(name=>{

                    const sheet=workbook.Sheets[name];

                    const data=XLSX.utils.sheet_to_json(
                        sheet,
                        {defval:""}
                    );

                    rows=rows.concat(data);

                });

                resolve(rows);

            }

            catch(error){

                reject(error);

            }

        };

        reader.readAsArrayBuffer(file);

    });

}


function extractRider(row,riderColumn,idColumn){

    let raw=String(
        row[riderColumn]||""
    )

    .trim()

    .replace(/\s+/g," ");


    let id=idColumn

    ?String(row[idColumn]||"")

    .replace(/[^0-9]/g,"")

    .trim()

    :"";


    if(!id){

        const match=raw.match(
            /(?:^|\s|\(|-)(\d{3,})(?:\)|\s|$)/
        );

        if(match){

            id=match[1];

        }

    }


    let name=raw;


    if(id){

        name=name.replace(
            new RegExp(
                "\\b"+id+"\\b",
                "g"
            ),
            ""
        );

    }


    name=name

    .replace(/[-_()]+/g," ")

    .replace(/\s+/g," ")

    .trim();


    return{

        id:id,

        name:titleCase(name),

        key:normalizeText(name)

    };

}


async function processExcel(){

    const orderFile=
    document.getElementById("orderFile").files[0];

    const templateFile=
    document.getElementById("templateFile").files[0];

    const fuelRate=
    Number(
        document.getElementById("fuelRate").value
    )||61;


    if(!orderFile){

        showMessage(
            "Please upload the Order List.",
            "error"
        );

        return;

    }


    try{

        showMessage(
            "Reading Order List...",
            "loading"
        );


        const rows=
        await readOrderFile(orderFile);


        if(!rows.length){

            throw new Error(
                "Order List is empty."
            );

        }


        const sample=rows[0];


        const riderColumn=findColumn(
            sample,
            [
                "Rider",
                "Rider Name",
                "Assigned To",
                "AssignedTo"
            ]
        );


        const idColumn=findColumn(
            sample,
            [
                "Rider ID",
                "RiderID",
                "Employee ID",
                "ID"
            ]
        );


        if(!riderColumn){

            throw new Error(
                "Rider column not found."
            );

        }


        showMessage(
            "Counting rider orders...",
            "loading"
        );


        const riders={};


        rows.forEach(row=>{

            const rider=
            extractRider(
                row,
                riderColumn,
                idColumn
            );


            if(!rider.name&&!rider.id)return;


            const key=

            rider.id

            ? "id_"+rider.id

            : "name_"+rider.key;


            if(!riders[key]){

                riders[key]={

                    id:rider.id,

                    name:rider.name,

                    orders:0

                };

            }


            riders[key].orders++;

        });


        const finalData=
        Object.values(riders)

        .map(rider=>({

            id:rider.id,

            name:rider.name,

            orders:rider.orders,

            orderAmount:
            rider.orders*fuelRate,

            otherAmount:0,

            graveYardAmount:0,

            totalAmount:
            rider.orders*fuelRate

        }));


        if(templateFile){

            showMessage(
                "Updating your original template...",
                "loading"
            );

            await updateTemplate(
                templateFile,
                finalData
            );

        }

        else{

            showMessage(
                "Creating Excel output...",
                "loading"
            );

            downloadStandardExcel(
                finalData
            );

        }


        showMessage(
            "Fuel Adjustment generated successfully!",
            "success"
        );

    }

    catch(error){

        console.error(error);

        showMessage(
            "Error: "+error.message,
            "error"
        );

    }

}


function downloadStandardExcel(data){

    const output=data.map(item=>({

        "ID":item.id,

        "Name":item.name,

        "No. of Order":item.orders,

        "Order Amount":item.orderAmount,

        "Other amount":item.otherAmount,

        "Grave yard order amount":
        item.graveYardAmount,

        "Total Amount":item.totalAmount

    }));


    output.push({

        "ID":"Total Order",

        "Name":"",

        "No. of Order":
        data.reduce(
            (a,b)=>a+b.orders,0
        ),

        "Order Amount":
        data.reduce(
            (a,b)=>a+b.orderAmount,0
        ),

        "Other amount":0,

        "Grave yard order amount":0,

        "Total Amount":
        data.reduce(
            (a,b)=>a+b.totalAmount,0
        )

    });


    const sheet=
    XLSX.utils.json_to_sheet(output);


    sheet["!cols"]=[

        {wch:15},
        {wch:28},
        {wch:15},
        {wch:18},
        {wch:15},
        {wch:28},
        {wch:18}

    ];


    const workbook=
    XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        sheet,
        "Fuel Adjustment"
    );


    const date=
    new Date()
    .toISOString()
    .split("T")[0];


    XLSX.writeFile(
        workbook,
        "Rider_Fuel_Adjustment_"
        +date+
        ".xlsx"
    );

}


async function updateTemplate(
    file,
    finalData
){

    /*
    LOAD ORIGINAL TEMPLATE
    */

    const buffer=
    await file.arrayBuffer();


    const workbook=
    new ExcelJS.Workbook();


    await workbook.xlsx.load(buffer);


    /*
    FIND MAIN SHEET
    */

    let worksheet=
    workbook.worksheets[0];


    for(const sheet of workbook.worksheets){

        let found=false;

        sheet.eachRow(row=>{

            row.eachCell(cell=>{

                const text=normalizeColumn(
                    cell.text||cell.value
                );

                if(
                    text==="nooforder"
                ){

                    found=true;

                }

            });

        });

        if(found){

            worksheet=sheet;

            break;

        }

    }


    /*
    FIND HEADER ROW
    */

    let headerRow=0;

    let idCol=0;
    let nameCol=0;
    let orderCol=0;
    let orderAmountCol=0;
    let otherCol=0;
    let graveCol=0;
    let totalCol=0;


    worksheet.eachRow(row=>{

        row.eachCell(cell=>{

            const text=
            normalizeColumn(
                cell.text||cell.value
            );


            if(text==="id"){

                headerRow=row.number;
                idCol=cell.col;

            }


            if(text==="name"){

                nameCol=cell.col;

            }


            if(
                text==="nooforder"
            ){

                orderCol=cell.col;

            }


            if(
                text==="orderamount"
            ){

                orderAmountCol=cell.col;

            }


            if(
                text==="otheramount"
            ){

                otherCol=cell.col;

            }


            if(
                text==="graveyardorderamount"
            ){

                graveCol=cell.col;

            }


            if(
                text==="totalamount"
            ){

                totalCol=cell.col;

            }

        });

    });


    if(!headerRow||!nameCol||!orderCol){

        throw new Error(
            "Could not read the template columns."
        );

    }


    /*
    UPDATE EXISTING RIDERS
    */

    let index=0;

    let totalOrders=0;
    let totalOrderAmount=0;
    let totalOther=0;
    let totalGrave=0;
    let grandTotal=0;


    for(
        let rowNumber=headerRow+1;
        rowNumber<=worksheet.rowCount;
        rowNumber++
    ){

        const row=
        worksheet.getRow(rowNumber);


        const firstText=
        normalizeText(
            row.getCell(1).text
        );


        /*
        STOP AT TOTAL ROW
        */

        if(
            firstText.includes("total order")
        ){

            if(orderCol)
            row.getCell(orderCol).value=
            totalOrders;

            if(orderAmountCol)
            row.getCell(orderAmountCol).value=
            totalOrderAmount;

            if(otherCol)
            row.getCell(otherCol).value=
            totalOther;

            if(graveCol)
            row.getCell(graveCol).value=
            totalGrave;

            if(totalCol)
            row.getCell(totalCol).value=
            grandTotal;

            break;

        }


        /*
        STOP IF NO MORE DATA
        */

        if(index>=finalData.length){

            continue;

        }


        const item=
        finalData[index];


        /*
        WRITE VALUES ONLY
        */

        if(idCol)
        row.getCell(idCol).value=item.id;

        row.getCell(nameCol).value=item.name;

        row.getCell(orderCol).value=item.orders;

        if(orderAmountCol)
        row.getCell(orderAmountCol).value=
        item.orderAmount;


        /*
        KEEP EXISTING OTHER AMOUNT
        */

        let other=0;

        if(otherCol){

            other=
            Number(
                row.getCell(otherCol).value
            )||0;

        }


        /*
        KEEP EXISTING GRAVE AMOUNT
        */

        let grave=0;

        if(graveCol){

            grave=
            Number(
                row.getCell(graveCol).value
            )||0;

        }


        const total=
        item.orderAmount
        +other
        +grave;


        if(totalCol)
        row.getCell(totalCol).value=total;


        totalOrders+=item.orders;

        totalOrderAmount+=
        item.orderAmount;

        totalOther+=other;

        totalGrave+=grave;

        grandTotal+=total;


        index++;

    }


    /*
    DOWNLOAD
    */

    const output=
    await workbook.xlsx.writeBuffer();


    const blob=
    new Blob(
        [output],
        {
            type:
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        }
    );


    const url=
    URL.createObjectURL(blob);


    const link=
    document.createElement("a");


    link.href=url;


    link.download=
    "Rider_Fuel_Adjustment.xlsx";


    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

}

</script>

</body>
</html>
